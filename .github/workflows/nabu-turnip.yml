name: nabu turnip build
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: Xcode on macos-26
        required: true
        default: "26.6"
permissions:
  contents: read
concurrency:
  group: nabu-turnip-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
jobs:
  turnip:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install host tools
        run: |
          brew install ninja glslang
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Cross-build Turnip for iOS against the A640 ABI
        id: turnip
        run: |
          python3 source-ci/nabu_turnip_ci.py --device nabu-device \
            --work "$RUNNER_TEMP/unixnu-turnip" --output "$RUNNER_TEMP/turnip-output"
      - name: Upload private output (including failed builds)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_INPUTS_TOKEN }}
          PRIVATE_INPUTS_REPO: ${{ vars.PRIVATE_INPUTS_REPO }}
        run: |
          TAG="turnip-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          OUT="$RUNNER_TEMP/turnip-output"
          test -d "$OUT" || exit 0
          tar -czf "$RUNNER_TEMP/$TAG.tar.gz" -C "$OUT" .
          test "$(gh api "repos/$PRIVATE_INPUTS_REPO" --jq .private)" = true
          gh release create "$TAG" "$RUNNER_TEMP/$TAG.tar.gz" --repo "$PRIVATE_INPUTS_REPO" \
            --title "$TAG" --notes "Private Turnip build output for public run $GITHUB_RUN_ID; compile/link only, not GPU-qualified."
      - name: Publish only the bounded report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnip-report-${{ github.run_id }}
          path: ${{ runner.temp }}/turnip-output/turnip-report.json
          if-no-files-found: warn
          retention-days: 30
